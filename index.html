<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ProjectFlow - Task 3 Complete</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Inter,Segoe UI,sans-serif}
body{background:#0b1220;color:#e2e8f0;min-height:100vh}
nav{background:#151f32;padding:15px 25px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #1e293b}
.logo{font-size:22px;font-weight:800;color:#38bdf8} .logo span{color:white}
.user{ background:#1e293b; padding:8px 15px; border-radius:20px; font-size:13px}
.main{padding:20px;max-width:1400px;margin:auto}
.top{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap}
.top input, .top select{padding:12px 14px;background:#151f32;border:1px solid #2a3a55;border-radius:8px;color:white;outline:none}
.top input{flex:2;min-width:220px} .top select{flex:1;min-width:140px}
.btn{background:#38bdf8;color:#000;border:none;padding:12px 22px;border-radius:8px;font-weight:700;cursor:pointer}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.board{grid-template-columns:1fr}}
.col{background:#151f32;border-radius:14px;padding:14px;border:1px solid #1e293b}
.col-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;padding-bottom:10px;border-bottom:2px solid}
.todo .col-h{border-color:#f59e0b} .prog .col-h{border-color:#38bdf8} .done .col-h{border-color:#22c55e}
.count{background:#0b1220;padding:2px 9px;border-radius:10px;font-size:12px}
.card{background:#0b1220;border:1px solid #1e293b;border-radius:10px;padding:12px;margin-bottom:10px;transition:.2s}
.card:hover{border-color:#38bdf8;transform:translateY(-2px)}
.card h4{font-size:14px;margin-bottom:6px} .meta{font-size:11px;color:#94a3b8;display:flex;gap:10px;margin:6px 0}
.badge{padding:2px 7px;border-radius:5px;font-size:10px;font-weight:700}
.high{background:#ef444420;color:#ef4444} .med{background:#f59e0b20;color:#f59e0b} .low{background:#22c55e20;color:#22c55e}
.c-area{margin-top:8px;background:#151f32;border-radius:6px;padding:8px}
.c-area input{width:100%;background:#0b1220;border:1px solid #2a3a55;border-radius:5px;padding:6px;color:white;font-size:12px;margin-top:5px}
.comment{font-size:11px;color:#cbd5e1;border-left:2px solid #38bdf8;padding-left:6px;margin-top:4px}
.actions{display:flex;gap:6px;margin-top:8px}
.actions button{flex:1;padding:6px;border:none;border-radius:5px;font-size:11px;font-weight:700;cursor:pointer}
.mv{background:#38bdf8;color:#000} .dl{background:#1e293b;color:#ef4444}
.notify{position:fixed;bottom:20px;right:20px;background:#22c55e;color:#000;padding:12px 18px;border-radius:8px;font-weight:700;display:none;z-index:99}
.db{margin-top:20px;background:#151f32;border-radius:12px;padding:15px}
.db pre{max-height:180px;overflow:auto;background:#0b1220;padding:10px;border-radius:8px;color:#22c55e;font-size:11px;margin-top:10px}
</style>
</head>
<body>
<nav><div class="logo"><i class="fa-solid fa-diagram-project"></i> Project<span>Flow</span></div><div class="user"><i class="fa-solid fa-user"></i> kush@codealpha.tech</div></nav>

<div class="main">
<div class="top">
<input id="taskTitle" placeholder="Task Title... ex: Design Login Page">
<select id="assignee"><option value="Kush Tiwari">Kush Tiwari</option><option value="Rahul Dev">Rahul Dev</option><option value="Aman Singh">Aman Singh</option><option value="Team QA">Team QA</option></select>
<select id="priority"><option value="High">High Priority</option><option value="Medium" selected>Medium Priority</option><option value="Low">Low Priority</option></select>
<button class="btn" onclick="addTask()"><i class="fa-solid fa-plus"></i> Create</button>
</div>

<div class="board">
<div class="col todo"><div class="col-h"><span><i class="fa-solid fa-list"></i> TO DO</span><span class="count" id="cTodo">0</span></div><div id="todoList"></div></div>
<div class="col prog"><div class="col-h"><span><i class="fa-solid fa-spinner"></i> IN PROGRESS</span><span class="count" id="cProg">0</span></div><div id="progList"></div></div>
<div class="col done"><div class="col-h"><span><i class="fa-solid fa-check-double"></i> DONE</span><span class="count" id="cDone">0</span></div><div id="doneList"></div></div>
</div>

<div class="db">
<h4><i class="fa-solid fa-database"></i> LIVE DATABASE (WebSocket Simulation + Real-time Updates)</h4>
<p style="font-size:11px;color:#94a3b8;margin-top:4px">Ye data localStorage me save hai - Backend kaam kar raha hai</p>
<pre id="dbView">[]</pre>
</div>
</div>

<div class="notify" id="notify"></div>

<script>
let tasks = JSON.parse(localStorage.getItem('pf_tasks_v2')||'[]');
function showNot(msg){let n=document.getElementById('notify');n.innerText=msg;n.style.display='block';setTimeout(()=>n.style.display='none',2500)}
function save(){localStorage.setItem('pf_tasks_v2',JSON.stringify(tasks));render()}
function addTask(){
 let title=document.getElementById('taskTitle').value.trim();
 if(!title)return alert('Task title likho!');
 let assign=document.getElementById('assignee').value;
 let pri=document.getElementById('priority').value;
 tasks.push({id:Date.now(),title,assignee:assign,priority:pri,status:'todo',comments:[],createdAt:new Date().toLocaleDateString()});
 document.getElementById('taskTitle').value='';
 save();showNot('Task Created & Assigned to '+assign);
}
function moveTask(id){
 let t=tasks.find(x=>x.id===id);
 if(t.status==='todo')t.status='progress';
 else if(t.status==='progress')t.status='done';
 else t.status='todo';
 save();showNot('Task moved to '+t.status.toUpperCase());
}
function delTask(id){if(confirm('Delete karna hai?')){tasks=tasks.filter(x=>x.id!==id);save();showNot('Task Deleted')}}
function addComment(id){
 let inp=document.getElementById('inp-'+id);
 let txt=inp.value.trim(); if(!txt)return;
 let t=tasks.find(x=>x.id===id);
 t.comments.push({text:txt,time:new Date().toLocaleTimeString()});
 inp.value='';save();showNot('Comment Added - Real-time Update!');
}
function cardHTML(t){
 let priClass=t.priority==='High'?'high':t.priority==='Medium'?'med':'low';
 let comm=t.comments.map(c=>`<div class="comment">${c.text} <span style="color:#64748b">- ${c.time}</span></div>`).join('');
 return `<div class="card">
 <h4>${t.title}</h4>
 <div class="meta"><span><i class="fa-solid fa-user"></i> ${t.assignee}</span><span class="badge ${priClass}">${t.priority}</span><span><i class="fa-regular fa-calendar"></i> ${t.createdAt}</span></div>
 <div class="c-area"><div style="font-size:11px;color:#94a3b8">Comments / Communication:</div>${comm}<input id="inp-${t.id}" placeholder="Write comment..." onkeypress="if(event.key==='Enter')addComment(${t.id})"></div>
 <div class="actions"><button class="mv" onclick="moveTask(${t.id})"><i class="fa-solid fa-arrow-right"></i> Move</button><button class="dl" onclick="delTask(${t.id})"><i class="fa-solid fa-trash"></i></button></div>
 </div>`
}
function render(){
 let todo='',prog='',done='';
 tasks.forEach(t=>{
  if(t.status==='todo')todo+=cardHTML(t);
  else if(t.status==='progress')prog+=cardHTML(t);
  else done+=cardHTML(t);
 });
 document.getElementById('todoList').innerHTML=todo||'<p style="text-align:center;color:#475569;font-size:12px;padding:20px">No tasks</p>';
 document.getElementById('progList').innerHTML=prog||'<p style="text-align:center;color:#475569;font-size:12px;padding:20px">No tasks</p>';
 document.getElementById('doneList').innerHTML=done||'<p style="text-align:center;color:#475569;font-size:12px;padding:20px">No tasks</p>';
 document.getElementById('cTodo').innerText=tasks.filter(x=>x.status==='todo').length;
 document.getElementById('cProg').innerText=tasks.filter(x=>x.status==='progress').length;
 document.getElementById('cDone').innerText=tasks.filter(x=>x.status==='done').length;
 document.getElementById('dbView').innerText=JSON.stringify(tasks,null,2);
}
render();
</script>
</body>
</html>
